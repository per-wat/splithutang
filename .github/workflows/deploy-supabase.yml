name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"

  workflow_dispatch:

jobs:
  deploy-db-1:
    name: Deploy Database 1
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DB1 }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DB1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Database 1
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations to Database 1
        run: supabase db push

  deploy-db-2:
    name: Deploy Database 2
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DB2 }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DB2 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Database 2
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations to Database 2
        run: supabase db push
